<!doctype html><meta charset="utf-8"><title>Goblin animation proof</title><style>body{background:#222;color:#fff;font:16px system-ui}canvas{border:1px solid #aaa;margin:10px}button{padding:8px;margin:4px}</style><h1>v04-cinder-crossbow-scout</h1><div id="buttons"></div><button onclick="start(state)">Replay</button><p id="label"></p><canvas id="dark" width="448" height="384"></canvas><canvas id="light" width="448" height="384"></canvas><canvas id="small" width="150" height="150"></canvas><script>let m,imgs={},state='idle',index=0,timer;const canvases=[dark,light,small];function draw(){let f=m.states[state].frames[index],im=imgs[f.file];canvases.forEach((c,k)=>{let x=c.getContext('2d');x.fillStyle=k===1?'#e2d9cd':'#232830';x.fillRect(0,0,c.width,c.height);if(k===2)x.drawImage(im,0,0,150,150*im.height/im.width);else x.drawImage(im,0,0);});label.textContent=state+' — frame '+index+' — '+f.durationMs+'ms';}function tick(){draw();let a=m.states[state];timer=setTimeout(()=>{if(index<a.frames.length-1){index++;tick()}else if(a.loop){index=0;tick()}else if(!a.terminal){start('idle')}},a.frames[index].durationMs)}function start(s){clearTimeout(timer);state=s;index=0;tick()}fetch('manifest.json').then(r=>r.json()).then(async x=>{m=x;for(let [s,a]of Object.entries(m.states)){let b=document.createElement('button');b.textContent=s;b.onclick=()=>start(s);buttons.append(b);for(let f of a.frames)if(!imgs[f.file]){let im=new Image;im.src=f.file;await im.decode();imgs[f.file]=im;}}start('idle')});</script>
