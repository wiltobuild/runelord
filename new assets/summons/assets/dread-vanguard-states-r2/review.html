<!doctype html><html><head><meta charset="utf-8"><title>Dread Vanguard animation review</title><style>body{margin:0;background:#17191f;color:#eee;font:16px system-ui}main{max-width:1120px;margin:28px auto;padding:20px}h1{font-size:24px}button,a{font:inherit;color:inherit}button{background:#30333c;border:1px solid #656570;border-radius:7px;padding:10px 16px;margin:4px;cursor:pointer}button.active{background:#86372f;border-color:#f08368}.stage{background:radial-gradient(ellipse at bottom,#493131,#22252e);border-radius:12px;display:grid;place-items:center;min-height:520px;margin-top:16px}canvas{max-width:100%;width:900px;height:auto}.meta{color:#bbb;margin:12px 0}.samples{width:100%;margin-top:28px}a{color:#ffb69d}</style></head><body><main><h1>Dread Vanguard · animation review</h1><div id="buttons"></div><button id="replay">Replay</button><button id="size">Game-size view</button><button id="bg">Light background</button><div class="stage" id="stage"><canvas width="2000" height="1200" id="c"></canvas></div><div class="meta" id="status"></div><p>Approved breathing idle and battle scale preserved. Actions play once; death holds its final pose. Use Replay to repeat an action.</p><a href="/summon-review?units=imp,hellhound,pit-brute&vanguard=states-r1">Open battle preview</a></main><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let selected='idle',start=performance.now(),small=false,light=false,manifest,images={};const labels={idle:'Idle',attack:'Cleave',cast:'Cast / command',block:'Block',hit:'Hit',wounded_idle:'Wounded idle',spawn:'Summon',die:'Death'};
async function init(){manifest=await(await fetch('/__vanguard-states/animation.json')).json();await Promise.all(Object.values(manifest.states).flatMap(s=>s.frames).map(f=>new Promise(resolve=>{if(images[f.src])return resolve();const im=new Image;images[f.src]=im;im.onload=resolve;im.onerror=resolve;im.src='/__vanguard-states/'+f.src;})));for(const n of Object.keys(labels)){const b=document.createElement('button');b.textContent=labels[n];b.dataset.state=n;b.onclick=()=>{selected=n;start=performance.now();update()};document.querySelector('#buttons').append(b)}update();requestAnimationFrame(draw)}
function update(){document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('active',b.dataset.state===selected))}
function draw(now){const s=manifest.states[selected];let t=now-start;if(s.loop)t%=s.duration;else t=Math.min(t,s.duration-1);let f=s.frames[0];for(const frame of s.frames)if(frame.time<=t)f=frame;ctx.clearRect(0,0,2000,1200);const im=images[f.src];if(im?.complete&&im.naturalWidth)ctx.drawImage(im,0,0);document.querySelector('#status').textContent=labels[selected]+' · '+s.frames.length+' frames · '+s.duration+'ms'+(!s.loop&&now-start>=s.duration?' · finished':'');requestAnimationFrame(draw)}
document.querySelector('#replay').onclick=()=>start=performance.now();document.querySelector('#size').onclick=()=>{small=!small;c.style.width=small?'460px':'900px'};document.querySelector('#bg').onclick=()=>{light=!light;document.querySelector('#stage').style.background=light?'#e8e3d9':''};init();
</script></body></html>
