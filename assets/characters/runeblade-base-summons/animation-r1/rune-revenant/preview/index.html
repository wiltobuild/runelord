<!doctype html><meta charset="utf-8"><title>Caster animation review</title><style>body{background:#161b23;color:white;font:16px system-ui}canvas{max-width:45vw;background:#161b23}#light{background:#e8e4dc}</style><h1>CASTER � review pending</h1><nav id="nav"></nav><button id="pause">Pause</button><div id="read"></div><canvas id="dark" width="1024" height="896"></canvas><canvas id="light" width="1024" height="896"></canvas><script type="module">const m=await(await fetch('../manifest.json')).json();let images={};for(const s of Object.values(m.states))for(const f of s.frames){let i=new Image;i.src='../'+f.file;await i.decode();images[f.file]=i}let state='idle',start=performance.now(),paused=false,elapsed=0;for(let k of Object.keys(m.states)){let b=document.createElement('button');b.textContent=k;b.onclick=()=>{state=k;start=performance.now();paused=false};nav.append(b)}pause.onclick=()=>{if(paused)start=performance.now()-elapsed;paused=!paused};function tick(now){if(!paused)elapsed=now-start;let s=m.states[state],n=Math.floor(elapsed/s.frame_duration_ms);if(!s.loop&&!s.terminal_hold&&n>=s.frames.length&&!paused){state='idle';start=now;elapsed=0;s=m.states[state];n=0}n=s.loop?n%s.frames.length:Math.min(n,s.frames.length-1);let f=s.frames[n];for(let c of [dark,light]){let x=c.getContext('2d');x.clearRect(0,0,1024,896);x.drawImage(images[f.file],0,0)}read.textContent=state+' '+(n+1)+'/'+s.frames.length+(s.terminal_hold&&n==s.frames.length-1?' terminal hold':'');requestAnimationFrame(tick)}requestAnimationFrame(tick)</script>
