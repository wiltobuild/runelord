<!doctype html><html><meta charset="utf-8"><title>Goblin warband · motion study</title><style>body{background:#151a20;color:#eee;font:16px system-ui;margin:24px}button,select{padding:9px;background:#354351;color:white;border:0;border-radius:5px;margin:5px}main{display:flex;flex-wrap:wrap}article{margin:8px;padding:14px;background:#222a33;border-radius:12px}canvas{display:block;background:#d3d7da;width:384px;height:384px}.small{width:170px;height:170px;background:#111820}p{max-width:850px;color:#b7c3cd}h2{margin:0}</style><h1>Goblin warband</h1><p>Articulated sprite motion study · low frame count · generated pose details may shift. Select a state to play it. Death plays once and holds; use Replay to restart.</p><select id="state"><option>idle</option><option>attack</option><option>hit</option><option>wounded_idle</option><option>die</option></select><button id="replay">Replay</button><button id="cycle">Cycle all states</button><main></main><script src="manifest.js"></script><script>
const m=window.spriteManifest,entries=[],sel=document.querySelector('select');let start=performance.now(),cycle=false;for(const [id,v]of Object.entries(m.variants)){let a=document.createElement('article');a.innerHTML=`<h2>${id}</h2><canvas width="512" height="512"></canvas><canvas class="small" width="512" height="512"></canvas><div class="status"></div>`;document.querySelector('main').append(a);let image=new Image();image.src=v.atlas;entries.push({v,a,image});}sel.onchange=()=>{start=performance.now();cycle=false};document.querySelector('#replay').onclick=()=>start=performance.now();document.querySelector('#cycle').onclick=()=>{cycle=!cycle;start=performance.now()};function tick(t){if(cycle){const names=Object.keys(entries[0].v.animations);sel.value=names[Math.floor((t-start)/2200)%names.length];}for(const {v,a,image}of entries){let s=v.animations[sel.value],elapsed=cycle?(t-start)%2200:t-start,at=s.loop?elapsed%s.total_ms:Math.min(elapsed,s.total_ms-1),ix=0;while(at>=s.duration_ms[ix]&&ix<s.frames.length-1){at-=s.duration_ms[ix++]}let f=v.frames[s.frames[ix]],r=f.rect;for(const c of a.querySelectorAll('canvas')){let x=c.getContext('2d');x.clearRect(0,0,512,512);if(image.complete)x.drawImage(image,...r,0,0,512,512)}a.querySelector('.status').textContent=`${sel.value} · pose ${s.frames[ix]+1} · ${s.total_ms} ms · ${s.loop?'loop':'one shot'}`;}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
