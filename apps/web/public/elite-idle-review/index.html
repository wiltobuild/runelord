<!doctype html><meta charset="utf-8"><title>Elite hero idle review</title><style>body{background:#171b22;color:#eee;font:16px system-ui}canvas{width:480px;max-width:45vw}button{padding:10px} .tiny{width:96px}</style><h1>Elite hero idle review</h1><button id="normal">Normal</button><button id="slow">Slow 0.25×</button><button id="pause">Pause</button><p id="status">Loading</p><canvas id="dark" width="480" height="480"></canvas><canvas id="light" width="480" height="480"></canvas><canvas id="tiny" class="tiny" width="96" height="96"></canvas><script>
const imgs=[];const seq=[0,1,2,3,4,5,6,7,6,5,4,3,2,1];let speed=1,elapsed=0,prev=0,paused=false;
Promise.all(Array.from({length:8},(_,i)=>new Promise((res,rej)=>{let im=new Image;im.onload=()=>{imgs[i]=im;res()};im.onerror=rej;im.src='./frames/idle-'+String(i).padStart(3,'0')+'.png'}))).then(()=>requestAnimationFrame(tick));normal.onclick=()=>speed=1;slow.onclick=()=>speed=.25;pause.onclick=()=>{paused=!paused;pause.textContent=paused?'Play':'Pause'};
function tick(t){if(prev&&!paused)elapsed+=(t-prev)*speed;prev=t;let ix=seq[Math.floor(elapsed/220)%seq.length];for(const [id,bg] of [['dark','#171b22'],['light','#e8e3da'],['tiny','#171b22']]){const c=document.getElementById(id),x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);x.drawImage(imgs[ix],0,0,c.width,c.height)}status.textContent='Runesmith frame '+ix+' · '+speed+'×';requestAnimationFrame(tick)}
</script>
